<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería</title>
    <style>
        body {
            margin: 0;
            background: #b4b0b0;
            font-family: sans-serif;
        }

        /* Contenedor general */
        #gallery-container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            padding-top: 40px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* Contenedor polaroid individual */
        .polaroid {
            background: white;
            padding: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            transform: translateY(40px);
            opacity: 0;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        /* Imagen */
        .polaroid img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            object-fit: cover;
        }

        /* Texto opcional */
        .caption {
            margin-top: 8px;
            font-size: 14px;
            color: #333;
            text-align: center;
        }

        /* Animación visible */
        .visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Efecto "The Pudding" (líneas alrededor) */
        .pudding-lines {
            position: relative;
        }

        .pudding-lines::before,
        .pudding-lines::after {
            content: "";
            position: absolute;
            border: 2px solid black;
            width: 100%;
            height: 100%;
            top: -6px;
            left: -6px;
            z-index: -1;
        }
        .pudding-lines::after {
            top: 6px;
            left: 6px;
        }
    </style>
</head>

<body>

    <!-- ⭐ TITULO AÑADIDO ⭐ -->
    <h1 style="text-align:center; margin-top:25px; font-size:32px;">
        GATOS QUE ME ENCUENTRO EN LA CALLE
    </h1>

    <!-- ⭐ BOTÓN DE REGRESO AÑADIDO ⭐ -->
    <div style="text-align:center; margin-bottom:20px;">
        <button onclick="history.back()" 
            style="
                padding:10px 22px;
                font-size:16px;
                border-radius:8px;
                border:none;
                background:#333;
                color:white;
                cursor:pointer;
            ">
            ⬅ Regresar
        </button>
    </div>
<!-- ⭐ TEXTO DEBAJO DEL BOTÓN ⭐ -->
<p style="text-align:center; max-width:700px; margin:0 auto 25px; font-size:18px; line-height:1.6;">
    Desde hace 6 años, siempre que me encuentro un gato en la calle, 
    a través de una ventana, o como sea, le tomo una foto. Ya reúno más de 190 fotos y, acá, solo pongo algunas de ellas.
</p>

    
    <!-- Tu contenedor original -->
    <div id="gallery-container"></div>

    <script src="galeria.js"></script>
</body>
</html>
